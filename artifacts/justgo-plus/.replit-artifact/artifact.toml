kind = "mobile"
previewPath = "/"
title = "JustGo Plus"
description = "A React Native recreation of the provided JustGo screens using MVVM, with login and registration UI, profile verification, toll transactions, monthly e-Invoice, and account settings."
version = "1.0.0"
id = "artifacts/justgo-plus"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20269

[services.development]
run = "pnpm --filter @workspace/justgo-plus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/justgo-plus", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/justgo-plus", "run", "serve" ]

[services.env]
PORT = "20269"
BASE_PATH = "/"
